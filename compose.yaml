# Composes Aurora for self-hosting: one PostgreSQL instance plus the single
# Aurora image (server + statically served web app). Configure via .env next
# to this file; see .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aurora}
    volumes:
      - aurora-db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aurora} -d ${POSTGRES_DB:-aurora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-aurora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aurora}
      # Must be the browser-visible origin; requests from any other site are rejected.
      AURORA_ORIGIN: ${AURORA_ORIGIN:-http://localhost:8080}
      # Longest practice_wait an MCP client may request, in seconds.
      AURORA_PRACTICE_WAIT_MAX_SECONDS: ${AURORA_PRACTICE_WAIT_MAX_SECONDS:-900}
    # Aurora has no login. Publish on loopback only and reach it through
    # Tailscale Serve (tailnet only), never Funnel or a LAN-facing port.
    ports:
      - "127.0.0.1:${AURORA_PORT:-8080}:8787"
    volumes:
      - aurora-uploads:/data/uploads
    restart: unless-stopped

volumes:
  aurora-db:
  aurora-uploads:
