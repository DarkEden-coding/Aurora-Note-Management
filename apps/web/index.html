<!-- This document is the PWA shell that boots Aurora's React app and applies the persisted dark theme before first paint. -->
<!doctype html>
<html lang="en" data-theme="neomorphic">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Aurora" />
    <meta
      name="description"
      content="Aurora — dark spatial notes with passkey auth and offline sync."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/aurora.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Aurora</title>
    <script>
      // Apply the account-level theme token set before React mounts to avoid a flash of the wrong surface.
      try {
        var stored = localStorage.getItem("aurora.theme");
        if (
          stored === "neomorphic" ||
          stored === "glass" ||
          stored === "minimal"
        ) {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {
        /* private mode: keep the default theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
