<!-- Aurora: two aurora curtains meeting in a star and pouring into a pen nib. Source for every app icon (scripts/generate-pwa-icons.mjs). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="0.42" stop-color="#121729"/>
      <stop offset="1" stop-color="#06070c"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#4d83f5" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5b8cff" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#69c8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b6fbe3"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="1" x2="0.65" y2="0">
      <stop offset="0" stop-color="#9a6bff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#a77dff" stop-opacity="0.7"/>
      <stop offset="0.75" stop-color="#7fe6d0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9fff3"/>
    </linearGradient>
    <linearGradient id="rayFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rays" width="14" height="512" patternUnits="userSpaceOnUse">
      <rect x="0" width="2.2" height="512" fill="url(#rayFade)"/>
      <rect x="7" width="1.2" height="512" fill="url(#rayFade)" opacity=".6"/>
    </pattern>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9c8ff"/>
    </linearGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <path id="leftCurtain" d="M66 430 C110 330 150 210 256 84 C214 168 188 250 168 430 Z"/>
    <path id="rightCurtain" d="M446 430 C402 330 362 210 256 84 C298 168 324 250 344 430 Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect id="backdrop" width="512" height="512" fill="url(#sky)"/>
    <g fill="#e4ecff">
      <circle cx="92" cy="104" r="2.4" opacity=".85"/><circle cx="418" cy="92" r="2.1" opacity=".75"/>
      <circle cx="372" cy="160" r="1.5" opacity=".55"/><circle cx="140" cy="182" r="1.4" opacity=".5"/>
      <circle cx="452" cy="232" r="1.7" opacity=".55"/><circle cx="58" cy="262" r="1.5" opacity=".45"/>
      <circle cx="320" cy="56" r="1.6" opacity=".7"/><circle cx="196" cy="52" r="1.3" opacity=".6"/>
    </g>
    <g id="art">
    <!-- bloom behind the curtains -->
    <g filter="url(#bloom)" opacity=".9">
      <use href="#leftCurtain" fill="url(#left)"/>
      <use href="#rightCurtain" fill="url(#right)"/>
    </g>
    <use href="#leftCurtain" fill="url(#left)"/>
    <use href="#rightCurtain" fill="url(#right)" opacity=".92"/>
    <!-- vertical aurora rays inside the curtains -->
    <g opacity=".55">
      <use href="#leftCurtain" fill="url(#rays)"/>
      <use href="#rightCurtain" fill="url(#rays)"/>
    </g>
    <!-- a spark where the curtains meet -->
    <g transform="translate(256 86)">
      <circle r="22" fill="#d9fff3" opacity=".55" filter="url(#bloom)"/>
      <path d="M0 -26 C3 -6 6 -3 26 0 C6 3 3 6 0 26 C-3 6 -6 3 -26 0 C-6 -3 -3 -6 0 -26 Z" fill="#f4fffb"/>
    </g>
    <!-- horizon glow and the nib the light pours into -->
    <ellipse cx="256" cy="430" rx="190" ry="46" fill="url(#pool)"/>
    <g transform="translate(256 336)">
      <ellipse cx="0" cy="0" rx="58" ry="70" fill="#9cc8ff" opacity=".45" filter="url(#bloom)"/>
      <!-- fountain-pen nib: shoulders, tapered tines, slit and breather hole -->
      <path d="M-30 -80 Q0 -94 30 -80 L36 -40 C36 -6 22 30 4 70 Q0 80 -4 70 C-22 30 -36 -6 -36 -40 Z" fill="url(#nib)"/>
      <path d="M-30 -80 Q0 -94 30 -80" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="3"/>
      <path d="M0 -26 L0 66" stroke="#0b1020" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="0" cy="-30" r="8" fill="#0b1020"/>
    </g>
  </g>
  </g>
</svg>
